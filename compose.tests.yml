services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: joyn_user
      POSTGRES_PASSWORD: joyn_test_local
      POSTGRES_DB: joyn_db
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyn_user -d joyn_db"]
      interval: 2s
      timeout: 3s
      retries: 30
