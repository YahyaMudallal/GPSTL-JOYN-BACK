server:
  port: ${PORT:8080}

spring:
  application:
    name: joyn
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joyn_db}
    username: ${DB_USER:joyn_user}
    password: ${DB_PASSWORD:joyn_secret}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  gemini:
    api-key: ${GOOGLE_API_KEY:}

joyn:
  cors:
    # Valeurs séparées par des virgules ; les motifs locaux acceptent les ports de dev variables.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],https://gpstl-joyn-front.joynpstl.workers.dev}
  siret:
    base-url: ${SIRET_API_BASE_URL:https://recherche-entreprises.api.gouv.fr}
    connect-timeout: ${SIRET_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${SIRET_API_READ_TIMEOUT:5s}
  security:
    jwt:
      # Clé secrète HS256 partagée avec la route de connexion qui génère les tokens.
      # Au moins 32 caractères. À remplacer par la variable JWT_SECRET hors développement.
      secret: ${JWT_SECRET:joyn-dev-secret-a-changer-en-production-32+}
      # Durée de validité d'un token de connexion, en secondes (3600 = 1 heure).
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  geocoding:
    base-url: https://api-adresse.data.gouv.fr

  storage:
    provider: ${JOYN_STORAGE_PROVIDER:supabase}
    supabase:
      endpoint: ${SUPABASE_S3_ENDPOINT:}
      region: ${SUPABASE_S3_REGION:}
      access-key: ${SUPABASE_S3_ACCESS_KEY:}
      secret-key: ${SUPABASE_S3_SECRET_KEY:}
      bucket: joyn_file_bucket
