server:
  port: ${PORT:8080}

spring:
  application:
    name: joyn
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joyn_db}
    username: ${DB_USER:joyn_user}
    password: ${DB_PASSWORD:joyn_secret}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true