openapi: 3.0.3
info:
  title: Joyn - Gestion des offres
  version: 1.0.0
  description: 'Identifiants numériques et champs du schéma PostgreSQL existant.

    Les opérations réutilisent la validation JWT HS256 de SecurityConfig (claim sub
    = users.id).

    Redis reste hors périmètre. Sans identité vérifiée, les routes retournent 401.

    ADMIN actif : toutes les offres ; RECRUITER actif : offres de sa société uniquement.

    '
security:
- bearerAuth: []
paths:
  /api/v1/jobs/{jobId}:
    parameters:
    - name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    patch:
      operationId: updateJob
      summary: Modifier partiellement une offre non supprimée
      description: 'Champs absents conservés. Champs protégés ou inconnus rejetés.

        Les bornes salariales sont contrôlées après fusion avec les valeurs existantes.

        Offre, compétences et audit sont modifiés dans une transaction unique.

        CLOSED par PATCH est réversible ; aucun deleted_at n''est renseigné.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPatch'
      responses:
        '200':
          description: Offre mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        location:
          type: string
          nullable: true
        contract_type_id:
          type: integer
          minimum: 1
          maximum: 32767
          description: Clé existante de contract_types
        salary_min:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          nullable: true
        salary_max:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          nullable: true
        salary_currency:
          type: string
          pattern: ^[A-Z]{3}$
        salary_period:
          type: string
          enum:
          - HOUR
          - MONTH
          - YEAR
        remote_mode:
          type: string
          enum:
          - ONSITE
          - HYBRID
          - REMOTE
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CLOSED
          - ARCHIVED
        rhythm_type:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        duration_months:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
        degree_level_required:
          type: string
          enum:
          - BAC_2
          - BAC_3
          - BAC_4
          - BAC_5
          nullable: true
        experience_level_required:
          type: string
          enum:
          - JUNIOR
          - MID
          - SENIOR
          nullable: true
        skills:
          type: array
          description: Remplace les associations ; tableau vide pour toutes les retirer.
          items:
            type: string
            minLength: 1
    Job:
      type: object
      required:
      - id
      - company_id
      - recruiter_id
      - title
      - description
      - status
      - skills
      - created_at
      - updated_at
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        location:
          type: string
          nullable: true
        contract_type_id:
          type: integer
          minimum: 1
          maximum: 32767
          description: Clé existante de contract_types
        salary_min:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          nullable: true
        salary_max:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          nullable: true
        salary_currency:
          type: string
          pattern: ^[A-Z]{3}$
        salary_period:
          type: string
          enum:
          - HOUR
          - MONTH
          - YEAR
        remote_mode:
          type: string
          enum:
          - ONSITE
          - HYBRID
          - REMOTE
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CLOSED
          - ARCHIVED
        rhythm_type:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        duration_months:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
        degree_level_required:
          type: string
          enum:
          - BAC_2
          - BAC_3
          - BAC_4
          - BAC_5
          nullable: true
        experience_level_required:
          type: string
          enum:
          - JUNIOR
          - MID
          - SENIOR
          nullable: true
        skills:
          type: array
          description: Remplace les associations ; tableau vide pour toutes les retirer.
          items:
            type: string
            minLength: 1
        id:
          type: integer
          format: int64
        company_id:
          type: integer
          format: int64
        recruiter_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
  responses:
    Invalid:
      description: Requête invalide, erreurs par champ lorsque disponibles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token absent, expiré ou invalide, ou utilisateur inexistant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Rôle non autorisé, compte suspendu ou entreprise différente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Offre inexistante ou déjà supprimée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Erreur interne ; transaction annulée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
