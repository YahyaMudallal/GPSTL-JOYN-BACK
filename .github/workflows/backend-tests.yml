name: Backend Tests

on:
  push:
    branches: [ "main", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: joyn_user
          POSTGRES_PASSWORD: joyn_secret
          POSTGRES_DB: joyn_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run tests with Maven
        env:
          DB_URL: jdbc:postgresql://localhost:5432/joyn_db
          DB_USER: joyn_user
          DB_PASSWORD: joyn_secret
        run: ./mvnw clean test